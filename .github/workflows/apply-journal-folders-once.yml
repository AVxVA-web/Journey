name: Apply RODO Journal Folders V1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and apply exact Journal Folders V1 changes
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/style.patch
          echo '' | base64 -d | gzip -d > /tmp/premium.patch
          git apply --check /tmp/style.patch
          git apply --check /tmp/premium.patch
          git apply /tmp/style.patch /tmp/premium.patch
          test "$(git hash-object -t blob css/style.css)" = "bef3f3d40be4012dc0ac943c90861a1c6743af5f"
          test "$(git hash-object -t blob js/premium-features.js)" = "b06cb2e73a515804bb5f58db65972447c038d68e"
          node --check js/premium-features.js
      - name: Commit exact patch and remove this one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-journal-folders-once.yml
          git config user.name "RODO Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css js/premium-features.js
          git add -u .github/workflows/apply-journal-folders-once.yml
          git commit -m "Add Journal Folders V1 and fix journal timeline"
          git push
